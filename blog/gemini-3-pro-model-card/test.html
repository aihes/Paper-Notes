<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacWeb OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(245, 245, 245, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent: #007AFF;
            --text: #000;
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.3);
            --dock-size: 60px;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            height: 100vh;
            user-select: none;
        }

        /* BOOT SCREEN */
        #boot {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }
        .apple-logo { font-size: 80px; margin-bottom: 40px; }
        .loading-bar {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 3s ease-in-out;
        }

        /* UI ELEMENTS */
        #desktop { width: 100%; height: 100%; position: relative; }

        /* TOP BAR */
        #top-bar {
            height: 28px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 500;
            color: #000;
            z-index: 1000;
        }
        .left-menu span, .right-menu span { margin: 0 10px; cursor: pointer; }
        .apple-icon { font-weight: bold; }

        /* DOCK */
        #dock-container {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 2000;
        }
        #dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 24px;
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .dock-item {
            width: var(--dock-size);
            height: var(--dock-size);
            background: linear-gradient(135deg, #fff, #ddd);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .dock-item:hover { transform: translateY(-10px) scale(1.1); }
        .dock-item::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            opacity: 0;
        }
        .dock-item.active::after { opacity: 1; }
        .dock-tooltip {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .dock-item:hover .dock-tooltip { opacity: 1; }

        /* WINDOWS */
        .window {
            position: absolute;
            background: #f5f5f7;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s, transform 0.2s;
            border: 1px solid rgba(0,0,0,0.1);
            resize: both;
        }
        .window.open { opacity: 1; transform: scale(1); }
        .window.minimized { 
            opacity: 0; 
            transform: translateY(100vh) scale(0); 
            pointer-events: none; 
        }
        
        .title-bar {
            height: 30px;
            background: linear-gradient(to bottom, #e6e6e6, #dcdcdc);
            display: flex;
            align-items: center;
            padding: 0 10px;
            cursor: default;
        }
        .traffic-lights { display: flex; gap: 8px; }
        .light { width: 12px; height: 12px; border-radius: 50%; position: relative; cursor: pointer; }
        .close-btn { background: #ff5f56; border: 1px solid #e0443e; }
        .min-btn { background: #ffbd2e; border: 1px solid #dea123; }
        .max-btn { background: #27c93f; border: 1px solid #1aab29; }
        
        .light:hover::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; color: rgba(0,0,0,0.5); font-family: sans-serif;
        }
        .close-btn:hover::after { content: '×'; }
        .min-btn:hover::after { content: '−'; }
        .max-btn:hover::after { content: '+'; }

        .window-title {
            flex-grow: 1; text-align: center; font-size: 13px; color: #444; font-weight: 600;
        }

        .window-content {
            flex-grow: 1;
            position: relative;
            background: #fff;
            overflow: auto;
        }

        /* APP SPECIFIC STYLES */
        /* Finder */
        .sidebar { width: 150px; background: rgba(240,240,240,0.9); height: 100%; float: left; padding-top: 10px; backdrop-filter: blur(10px);}
        .sidebar-item { padding: 5px 15px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .sidebar-item:hover { background: rgba(0,0,0,0.05); }
        .sidebar-title { font-size: 11px; color: #888; padding: 5px 15px; font-weight: bold; margin-top: 10px; }
        .finder-main { height: 100%; margin-left: 150px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); align-content: start; gap: 15px; }
        .file-icon { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .file-icon i { font-size: 32px; color: #007AFF; }
        .file-name { font-size: 12px; text-align: center; max-width: 80px; word-wrap: break-word; }

        /* Paint */
        #paint-canvas { cursor: crosshair; }
        .paint-tools { padding: 10px; background: #eee; display: flex; gap: 10px; border-bottom: 1px solid #ccc; }
        .color-picker { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Terminal */
        .terminal-body { background: #1e1e1e; color: #27c93f; font-family: 'Courier New', monospace; padding: 10px; height: 100%; font-size: 14px; }
        .term-line { margin-bottom: 5px; }
        .term-input { background: transparent; border: none; color: #fff; outline: none; width: 80%; font-family: inherit; }

        /* CineStream (Video Editor) */
        .cine-layout { display: flex; flex-direction: column; height: 100%; background: #222; color: #ddd; }
        .cine-top { display: flex; height: 60%; border-bottom: 2px solid #444; }
        .cine-media { width: 30%; border-right: 1px solid #444; padding: 10px; font-size: 12px; }
        .cine-preview { flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .play-btn { position: absolute; font-size: 40px; color: rgba(255,255,255,0.5); cursor: pointer; }
        .cine-timeline { flex-grow: 1; background: #333; position: relative; overflow-x: auto; padding: 10px; }
        .track { height: 40px; background: #444; margin-bottom: 5px; position: relative; border-radius: 4px; }
        .clip { position: absolute; height: 100%; background: #007AFF; opacity: 0.7; border-radius: 4px; border: 1px solid #66adff; top:0; cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 10px; overflow: hidden;}
        .scrubber { position: absolute; top: 0; left: 20px; width: 2px; height: 100%; background: red; z-index: 10; }

        /* Desktop Icons */
        .desktop-icons {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
        }
        .d-icon { text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); cursor: pointer; width: 80px;}
        .d-icon i { font-size: 40px; margin-bottom: 5px; color: #fff; }
        .d-icon span { font-size: 12px; font-weight: 500; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- BOOT SCREEN -->
    <div id="boot">
        <div class="apple-logo"><i class="fab fa-apple"></i></div>
        <div class="loading-bar"><div class="progress" id="boot-progress"></div></div>
    </div>

    <div id="desktop" style="display:none;">
        <!-- TOP BAR -->
        <div id="top-bar">
            <div class="left-menu">
                <span class="apple-icon"><i class="fab fa-apple"></i></span>
                <span id="active-app-name">Finder</span>
                <span>File</span>
                <span>Edit</span>
                <span>View</span>
                <span>Go</span>
                <span>Window</span>
                <span>Help</span>
            </div>
            <div class="right-menu">
                <span><i class="fas fa-battery-full"></i> 100%</span>
                <span><i class="fas fa-wifi"></i></span>
                <span><i class="fas fa-search"></i></span>
                <span><i class="fas fa-list"></i></span>
                <span id="clock">12:00 PM</span>
            </div>
        </div>

        <!-- DESKTOP ICONS -->
        <div class="desktop-icons">
            <div class="d-icon" onclick="openApp('finder')">
                <i class="fas fa-hdd"></i><br><span>Macintosh HD</span>
            </div>
            <div class="d-icon" onclick="createNote()">
                <i class="fas fa-file-alt"></i><br><span>Readme.txt</span>
            </div>
        </div>

        <!-- WINDOWS AREA -->
        <div id="windows-area"></div>

        <!-- DOCK -->
        <div id="dock-container">
            <div id="dock">
                <div class="dock-item" onclick="openApp('finder')" style="background: linear-gradient(to bottom, #00C7FF, #007AFF);">
                    <i class="fas fa-smile"></i>
                    <div class="dock-tooltip">Finder</div>
                </div>
                <div class="dock-item" onclick="openApp('safari')" style="background: white;">
                    <i class="fab fa-safari" style="color: #007AFF;"></i>
                    <div class="dock-tooltip">Safari</div>
                </div>
                <div class="dock-item" onclick="openApp('textedit')" style="background: #444;">
                    <i class="fas fa-pen-fancy" style="color:white;"></i>
                    <div class="dock-tooltip">TextEdit</div>
                </div>
                <div class="dock-item" onclick="openApp('paint')" style="background: linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);">
                    <i class="fas fa-palette" style="color: white;"></i>
                    <div class="dock-tooltip">Paint</div>
                </div>
                <div class="dock-item" onclick="openApp('cine')" style="background: #222;">
                    <i class="fas fa-film" style="color: #A020F0;"></i>
                    <div class="dock-tooltip">CineStream</div>
                </div>
                <div class="dock-item" onclick="openApp('terminal')" style="background: #000;">
                    <i class="fas fa-terminal" style="color: #fff; font-size: 18px;"></i>
                    <div class="dock-tooltip">Terminal</div>
                </div>
                <div class="dock-item" onclick="openApp('calculator')" style="background: #333;">
                    <i class="fas fa-calculator" style="color: orange;"></i>
                    <div class="dock-tooltip">Calculator</div>
                </div>
                <div class="dock-item" onclick="openApp('settings')" style="background: #bbb;">
                    <i class="fas fa-cog" style="color: #333;"></i>
                    <div class="dock-tooltip">Settings</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SYSTEM STATE
        const system = {
            zIndex: 100,
            activeApp: 'Finder',
            fileSystem: {
                'Documents': [
                    { name: 'Project_Plan.txt', type: 'text', content: 'Phase 1: Build WebOS\nPhase 2: ???\nPhase 3: Profit' },
                    { name: 'Budget.csv', type: 'file', content: 'Item,Cost\nCoffee,100\nSnacks,200' }
                ],
                'Pictures': [
                    { name: 'vacation.png', type: 'image', content: '' },
                    { name: 'design_mockup.png', type: 'image', content: '' }
                ],
                'Desktop': []
            }
        };

        // BOOT SEQUENCE
        window.onload = () => {
            const progress = document.getElementById('boot-progress');
            setTimeout(() => { progress.style.width = '40%'; }, 500);
            setTimeout(() => { progress.style.width = '100%'; }, 1500);
            
            setTimeout(() => {
                playBootSound();
                document.getElementById('boot').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                }, 1000);
            }, 3500);

            setInterval(updateClock, 1000);
            updateClock();
        };

        function playBootSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if(!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, ctx.currentTime); // F3
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 3);
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
            document.title = `MacWeb OS - ${hours}:${minutes} ${ampm}`;
        }

        // WINDOW MANAGER
        class Window {
            constructor(id, title, width, height, contentFunc, x, y) {
                this.id = id + '-' + Date.now();
                this.title = title;
                this.width = width;
                this.height = height;
                this.element = null;
                this.render(contentFunc, x, y);
                this.addEventListeners();
            }

            render(contentFunc, startX, startY) {
                const win = document.createElement('div');
                win.className = 'window open';
                win.id = this.id;
                win.style.width = this.width + 'px';
                win.style.height = this.height + 'px';
                win.style.left = (startX || (window.innerWidth/2 - this.width/2)) + 'px';
                win.style.top = (startY || (window.innerHeight/2 - this.height/2)) + 'px';
                win.style.zIndex = ++system.zIndex;

                win.innerHTML = `
                    <div class="title-bar">
                        <div class="traffic-lights">
                            <div class="light close-btn" onclick="closeWindow('${this.id}')"></div>
                            <div class="light min-btn" onclick="minimizeWindow('${this.id}')"></div>
                            <div class="light max-btn" onclick="maximizeWindow('${this.id}')"></div>
                        </div>
                        <div class="window-title">${this.title}</div>
                    </div>
                    <div class="window-content">${contentFunc()}</div>
                `;
                
                document.getElementById('windows-area').appendChild(win);
                this.element = win;
                document.getElementById('active-app-name').innerText = this.title;
            }

            addEventListeners() {
                const header = this.element.querySelector('.title-bar');
                let isDragging = false, startX, startY, initialLeft, initialTop;

                this.element.addEventListener('mousedown', () => {
                    this.element.style.zIndex = ++system.zIndex;
                    document.getElementById('active-app-name').innerText = this.title;
                });

                header.addEventListener('mousedown', (e) => {
                    if(e.target.classList.contains('light')) return; // Don't drag on buttons
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = this.element.offsetLeft;
                    initialTop = this.element.offsetTop;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    this.element.style.left = `${initialLeft + dx}px`;
                    this.element.style.top = `${initialTop + dy}px`;
                });

                document.addEventListener('mouseup', () => { isDragging = false; });
            }
        }

        function closeWindow(id) {
            const el = document.getElementById(id);
            el.classList.remove('open');
            setTimeout(() => el.remove(), 200);
        }
        
        function minimizeWindow(id) {
            document.getElementById(id).classList.add('minimized');
        }

        function maximizeWindow(id) {
            const el = document.getElementById(id);
            if(el.style.width === '100%') {
                el.style.width = el.dataset.prevWidth;
                el.style.height = el.dataset.prevHeight;
                el.style.top = el.dataset.prevTop;
                el.style.left = el.dataset.prevLeft;
            } else {
                el.dataset.prevWidth = el.style.width;
                el.dataset.prevHeight = el.style.height;
                el.dataset.prevTop = el.style.top;
                el.dataset.prevLeft = el.style.left;
                el.style.width = '100%';
                el.style.height = 'calc(100% - 30px)'; // Account for top bar
                el.style.top = '30px';
                el.style.left = '0';
            }
        }

        // APP LAUNCHER LOGIC
        function openApp(appName) {
            const defaults = {
                'finder': { title: 'Finder', w: 600, h: 400, content: getFinderContent },
                'textedit': { title: 'TextEdit', w: 400, h: 500, content: getTextEditContent },
                'paint': { title: 'Paint', w: 500, h: 400, content: getPaintContent },
                'terminal': { title: 'Terminal', w: 500, h: 300, content: getTerminalContent },
                'safari': { title: 'Safari', w: 800, h: 600, content: getSafariContent },
                'calculator': { title: 'Calculator', w: 250, h: 350, content: getCalcContent },
                'cine': { title: 'CineStream Pro', w: 800, h: 500, content: getCineContent },
                'settings': { title: 'System Settings', w: 600, h: 400, content: getSettingsContent }
            };

            const app = defaults[appName];
            if (app) {
                new Window(appName, app.title, app.w, app.h, app.content);
                // Post-render hooks
                if(appName === 'paint') initPaint();
                if(appName === 'terminal') initTerminal();
                if(appName === 'cine') initCine();
            }
        }

        // APP CONTENT GENERATORS
        function getFinderContent() {
            return `
                <div style="height:100%;">
                    <div class="sidebar">
                        <div class="sidebar-title">Favorites</div>
                        <div class="sidebar-item" onclick="loadDir('Documents')"><i class="fas fa-folder"></i> Documents</div>
                        <div class="sidebar-item" onclick="loadDir('Pictures')"><i class="fas fa-images"></i> Pictures</div>
                        <div class="sidebar-item" onclick="loadDir('Desktop')"><i class="fas fa-desktop"></i> Desktop</div>
                        <div class="sidebar-title">iCloud</div>
                        <div class="sidebar-item"><i class="fas fa-cloud"></i> iCloud Drive</div>
                    </div>
                    <div class="finder-main" id="finder-content">
                        ${renderFiles('Documents')}
                    </div>
                </div>
            `;
        }

        function loadDir(dir) {
            document.getElementById('finder-content').innerHTML = renderFiles(dir);
        }

        function renderFiles(dir) {
            const files = system.fileSystem[dir] || [];
            if(files.length === 0) return '<div style="color:#888; width:100%; text-align:center; padding-top:20px;">Empty Folder</div>';
            return files.map(f => `
                <div class="file-icon">
                    <i class="fas ${f.type === 'text' ? 'fa-file-alt' : 'fa-image'}"></i>
                    <div class="file-name">${f.name}</div>
                </div>
            `).join('');
        }

        function getTextEditContent() {
            return `<textarea style="width:100%; height:100%; border:none; outline:none; padding:10px; font-family: 'Helvetica', sans-serif; resize:none;" placeholder="Start typing..."></textarea>`;
        }

        function getSafariContent() {
            return `
                <div style="display:flex; flex-direction:column; height:100%;">
                    <div style="background:#eee; padding:8px; display:flex; gap:10px;">
                        <i class="fas fa-arrow-left" style="color:#888;"></i>
                        <i class="fas fa-arrow-right" style="color:#888;"></i>
                        <input type="text" value="apple.com" style="flex-grow:1; border-radius:5px; border:1px solid #ccc; padding:2px 10px;">
                    </div>
                    <iframe src="about:blank" style="flex-grow:1; border:none; background:#fff;"></iframe>
                    <div style="position:absolute; top:50%; left:0; width:100%; text-align:center; color:#888; pointer-events:none;">
                        <i class="fab fa-apple" style="font-size:64px; margin-bottom:20px;"></i><br>
                        Safari Demo<br>(Real browsing restricted)
                    </div>
                </div>
            `;
        }

        function getPaintContent() {
            return `
                <div style="height:100%; display:flex; flex-direction:column;">
                    <div class="paint-tools">
                        <div class="color-picker" style="background:black;" onclick="setPaintColor('black')"></div>
                        <div class="color-picker" style="background:red;" onclick="setPaintColor('red')"></div>
                        <div class="color-picker" style="background:blue;" onclick="setPaintColor('blue')"></div>
                        <div class="color-picker" style="background:green;" onclick="setPaintColor('green')"></div>
                        <button onclick="clearCanvas()">Clear</button>
                    </div>
                    <canvas id="paint-canvas" style="flex-grow:1; background:white; width:100%; height:100%;"></canvas>
                </div>
            `;
        }

        let paintColor = 'black';
        function setPaintColor(c) { paintColor = c; }
        function clearCanvas() {
            const canvas = document.getElementById('paint-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }

        function initPaint() {
            const canvas = document.getElementById('paint-canvas');
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            const ctx = canvas.getContext('2d');
            let painting = false;

            function startPosition(e) { painting = true; draw(e); }
            function finishedPosition() { painting = false; ctx.beginPath(); }
            function draw(e) {
                if(!painting) return;
                const rect = canvas.getBoundingClientRect();
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = paintColor;
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            }

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', finishedPosition);
            canvas.addEventListener('mousemove', draw);
        }

        function getTerminalContent() {
            return `
                <div class="terminal-body" onclick="document.getElementById('term-in').focus()">
                    <div id="term-output">
                        <div>Last login: ${new Date().toDateString()} on console</div>
                        <div class="term-line">Welcome to MacWebOS. Type 'help' for commands.</div>
                    </div>
                    <div style="display:flex;">
                        <span>user@macbook:~$ &nbsp;</span>
                        <input id="term-in" class="term-input" type="text" autocomplete="off" autofocus>
                    </div>
                </div>
            `;
        }

        function initTerminal() {
            const input = document.getElementById('term-in');
            const output = document.getElementById('term-output');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = this.value.trim();
                    const line = document.createElement('div');
                    line.className = 'term-line';
                    line.textContent = `user@macbook:~$ ${cmd}`;
                    output.appendChild(line);
                    
                    const response = document.createElement('div');
                    response.className = 'term-line';
                    
                    switch(cmd.toLowerCase()) {
                        case 'help': response.textContent = "Available commands: help, clear, ls, date, whoami, reboot"; break;
                        case 'clear': output.innerHTML = ''; response.textContent = ''; break;
                        case 'ls': response.textContent = "Documents  Pictures  Desktop  Downloads"; break;
                        case 'date': response.textContent = new Date().toString(); break;
                        case 'whoami': response.textContent = "root"; break;
                        case 'reboot': location.reload(); break;
                        case '': break;
                        default: response.textContent = `command not found: ${cmd}`;
                    }
                    output.appendChild(response);
                    this.value = '';
                    output.scrollTop = output.scrollHeight;
                }
            });
        }

        function getCalcContent() {
            return `
                <div style="height:100%; background:#333; display:flex; flex-direction:column;">
                    <div style="color:white; font-size:40px; text-align:right; padding:20px; font-weight:200;" id="calc-display">0</div>
                    <div style="display:grid; grid-template-columns:repeat(4, 1fr); flex-grow:1; gap:1px; background:#333;">
                        ${['C','±','%','/','7','8','9','x','4','5','6','-','1','2','3','+','0','.','='].map(k => {
                            let bg = '#555'; let col = 'white';
                            if(['/','x','-','+','='].includes(k)) { bg = '#ff9f0a'; col='white'; }
                            else if(['C','±','%'].includes(k)) { bg = '#a5a5a5'; col='black'; }
                            const span = k === '0' ? 'grid-column: span 2;' : '';
                            return `<button onclick="calcInput('${k}')" style="${span} background:${bg}; color:${col}; border:none; font-size:20px; cursor:pointer; border-radius:0;">${k}</button>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        let calcVal = '0';
        function calcInput(v) {
            const disp = document.getElementById('calc-display');
            if(v === 'C') calcVal = '0';
            else if(v === '=') { try { calcVal = eval(calcVal.replace('x','*')); } catch { calcVal = 'Error'; } }
            else { calcVal = calcVal === '0' ? v : calcVal + v; }
            disp.textContent = calcVal;
        }
